name: cuesheet_domain
description: >-
  Pure-Dart domain layer for Cuesheet: entities, the playback intent algebra,
  the episode filter vocabulary, and listening-state semantics. Deliberately
  depends on no Flutter, no database, and no I/O of any kind.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.4

resolution: workspace

dependencies:
  collection: ^1.19.0
  meta: ^1.17.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.2
