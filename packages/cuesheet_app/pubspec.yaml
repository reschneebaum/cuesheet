name: cuesheet_app
description: >-
  The Cuesheet app. Until Phase 5 this is a deliberately ugly debug harness:
  lists, buttons, and no design at all, existing so the engine underneath can
  be driven by hand long before there is a real interface.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.4

resolution: workspace

dependencies:
  cuesheet_data:
    path: ../cuesheet_data
  cuesheet_domain:
    path: ../cuesheet_domain
  cuesheet_playback:
    path: ../cuesheet_playback
  cuesheet_ui:
    path: ../cuesheet_ui
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0

dev_dependencies:
  # Used by widget tests to swap the real database for an in-memory one.
  drift: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
